<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atset AI</title>
<style>
:root{--bg:#000;--fg:#f1f2f6;--mut:#9a9eb0;--glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.12);--stroke:rgba(255,255,255,.16);--shadow:rgba(0,0,0,.45);--ink:#000;--err:#ff7a8a;--ok:#6fe3b0;--fs:16px}
[data-theme=light]{--bg:#eef1f8;--fg:#14151b;--mut:#5d6173;--glass:rgba(255,255,255,.6);--glass2:rgba(255,255,255,.85);--stroke:rgba(20,21,27,.12);--shadow:rgba(60,70,110,.2);--ink:#14151b;--err:#c9304a;--ok:#13804f}
[data-accent=pink]{--a:255,138,190;--a2:255,176,210}
[data-accent=blue]{--a:110,185,255;--a2:160,215,255}
*{box-sizing:border-box;margin:0}
html{font-size:var(--fs)}
body{font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);height:100vh;height:100dvh;overflow:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
:root{--accent:rgb(var(--a))}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
.bg i:nth-child(1){width:46vmax;height:46vmax;left:-12vmax;top:-10vmax;background:rgb(255,138,190)}
.bg i:nth-child(2){width:42vmax;height:42vmax;right:-12vmax;bottom:-12vmax;background:rgb(110,185,255)}
[data-theme=light] .bg i{opacity:.4}
[data-theme=dark] .bg{display:none}
.hidden{display:none!important}
.view{position:relative;z-index:1;height:100%}
.glass{background:var(--glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--stroke);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 12px 40px var(--shadow)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{padding:.7rem 1.1rem;border-radius:999px;font-weight:600;font-size:.9rem;background:linear-gradient(135deg,rgba(var(--a),.85),rgba(var(--a2),.55));color:var(--ink);border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 22px rgba(var(--a),.35);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--glass);color:var(--fg);border-color:var(--stroke);box-shadow:none}
.btn.danger{background:rgba(255,90,110,.16);color:var(--err);border-color:rgba(255,90,110,.4);box-shadow:none}
.field{display:block;margin-bottom:.9rem}
.field>span{display:block;font-size:.78rem;color:var(--mut);margin-bottom:.3rem}
.inp{width:100%;padding:.72rem .9rem;border-radius:14px;background:var(--glass);border:1px solid var(--stroke);font-size:.92rem}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(var(--a),.25)}
.inp[readonly]{opacity:.65}
.pw{position:relative}.pw button{position:absolute;right:.5rem;top:50%;transform:translateY(-50%);font-size:.75rem;color:var(--mut);padding:.3rem .5rem}
.msg{font-size:.8rem;min-height:1.1rem;margin:.1rem 0 .7rem}.msg.e{color:var(--err)}.msg.o{color:var(--ok)}
.hint{font-size:.76rem;color:var(--mut)}
.link{color:var(--accent);font-size:.82rem;text-decoration:underline;text-underline-offset:3px}
/* auth */
#auth{display:grid;place-items:center;padding:1.2rem;overflow:auto}
.card{width:100%;max-width:420px;border-radius:30px;padding:1.8rem}
.brand{display:flex;align-items:center;gap:.7rem;margin-bottom:1.2rem}
.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(var(--a),.9),rgba(var(--a2),.5));border:1px solid rgba(255,255,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.logo svg{width:22px;height:22px;fill:var(--ink)}
.brand b{font-size:1.25rem;letter-spacing:-.02em}
.card h1{font-size:1.5rem;letter-spacing:-.02em;margin-bottom:.25rem}
.card .sub{color:var(--mut);font-size:.88rem;margin-bottom:1.2rem}
.tabs{display:flex;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--stroke);margin-bottom:1.3rem}
.tabs button{flex:1;padding:.55rem;border-radius:999px;font-size:.86rem;color:var(--mut);font-weight:600}
.tabs button.on{background:var(--glass2);color:var(--fg);box-shadow:0 2px 10px var(--shadow)}
.meter{height:5px;border-radius:9px;background:var(--glass);margin:.4rem 0 .2rem;overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--err);transition:width .25s,background .25s}
.row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-bottom:1rem}
.chk{display:flex;gap:.45rem;align-items:center;font-size:.82rem;color:var(--mut)}.chk input{accent-color:var(--accent);width:16px;height:16px}
/* app */
#app{display:flex;gap:.35rem;padding:.35rem}
aside{width:272px;flex:none;border-radius:26px;display:flex;flex-direction:column;padding:.8rem;overflow:hidden;transition:width .35s cubic-bezier(.22,1,.36,1),margin .35s cubic-bezier(.22,1,.36,1),padding .35s,opacity .25s,transform .3s cubic-bezier(.22,1,.36,1)}
aside>*{min-width:240px}
.side-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem}
.chats{flex:1;overflow:auto;margin:.8rem -.2rem 0;padding:0 .2rem}
.chat-item{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:.6rem .8rem;border-radius:14px;font-size:.86rem;color:var(--mut);margin-bottom:2px}
.chat-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item:hover,.chat-item.on{background:var(--glass2);color:var(--fg)}
.chat-item .x{opacity:0;padding:0 .3rem}.chat-item:hover .x{opacity:1}
.me{display:flex;align-items:center;gap:.6rem;padding:.55rem;border-radius:18px;margin-top:.6rem;width:100%;text-align:left}
.me:hover{background:var(--glass2)}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--ink);background:linear-gradient(135deg,rgba(var(--a),.95),rgba(var(--a2),.6));border:1px solid rgba(255,255,255,.5)}
.me div{min-width:0}.me b{display:block;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.me small{color:var(--mut);font-size:.72rem}
main{flex:1;min-width:0;display:flex;flex-direction:column;border-radius:26px;overflow:hidden}
header{display:flex;align-items:center;gap:.6rem;padding:.8rem 1rem;border-bottom:1px solid var(--stroke)}
header .t{font-weight:700;letter-spacing:-.02em}
.badge{font-size:.72rem;padding:.2rem .65rem;border-radius:99px;background:var(--glass);border:1px solid var(--stroke);color:var(--mut)}
.icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}.icon:hover{background:var(--glass2);color:var(--fg)}
.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(min-width:761px){#app:not(.collapsed) #menu{display:none}#app.collapsed aside{width:0;margin-right:-.35rem;padding-left:0;padding-right:0;opacity:0;border-width:0;pointer-events:none}}
#log{flex:1;overflow:auto;padding:1rem .75rem}
.wrap{max-width:760px;margin:0 auto}
.empty{text-align:center;margin-top:14vh}.empty h2{font-size:1.9rem;letter-spacing:-.03em;margin-bottom:.4rem}.empty p{color:var(--mut)}
.m{display:flex;margin-bottom:.9rem}.m.u{justify-content:flex-end}
.bub{max-width:85%;padding:.7rem 1rem;border-radius:20px;white-space:pre-wrap;word-wrap:break-word;line-height:1.5;font-size:.95rem}
.u .bub{background:linear-gradient(135deg,rgba(var(--a),.55),rgba(var(--a2),.3));border:1px solid rgba(255,255,255,.35);border-bottom-right-radius:6px}
.a .bub{background:var(--glass);border:1px solid var(--stroke);border-bottom-left-radius:6px}
.a .bub.err{color:var(--err)}
.dots i{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--mut);animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px);opacity:.4}}
.composer{padding:.5rem .7rem .7rem}
.box{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:.5rem;padding:.45rem .45rem .45rem 1rem;border-radius:26px}
.box textarea{flex:1;background:none;border:0;resize:none;outline:none;max-height:160px;padding:.55rem 0;font-size:.95rem}
.send{width:42px;height:42px;padding:0;display:grid;place-items:center}.send svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* settings */
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:1rem;background:rgba(5,6,10,.5);backdrop-filter:blur(6px)}
.modal{width:100%;max-width:760px;height:min(600px,92dvh);border-radius:30px;display:flex;overflow:hidden;background:var(--bg)}
.modal.glass{background:color-mix(in srgb,var(--bg) 80%,transparent)}
.snav{width:200px;flex:none;padding:1rem;border-right:1px solid var(--stroke);display:flex;flex-direction:column;gap:3px}
.snav h3{font-size:1.05rem;margin:.2rem .6rem .8rem}
.snav button{text-align:left;padding:.6rem .8rem;border-radius:14px;font-size:.88rem;color:var(--mut)}
.snav button.on{background:var(--glass2);color:var(--fg);font-weight:600}
.spane{flex:1;overflow:auto;padding:1.3rem 1.5rem;position:relative}
.spane h2{font-size:1.2rem;margin-bottom:1rem;letter-spacing:-.02em}
.pane{display:none}.pane.on{display:block}
.sec{padding:1rem 0;border-top:1px solid var(--stroke);margin-top:1rem}.sec h4{font-size:.95rem;margin-bottom:.7rem}
.close{position:absolute;right:.8rem;top:.8rem}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--stroke);margin-bottom:1rem}
.seg button{padding:.5rem 1rem;border-radius:999px;font-size:.84rem;color:var(--mut);font-weight:600}.seg button.on{background:var(--glass2);color:var(--fg);box-shadow:0 2px 10px var(--shadow)}
.lbl{font-size:.8rem;color:var(--mut);margin-bottom:.4rem}
.sw{display:flex;gap:.8rem;margin-bottom:1rem;flex-wrap:wrap}
.sw button{display:flex;align-items:center;gap:.6rem;padding:.6rem 1rem .6rem .6rem;border-radius:999px;border:1px solid var(--stroke);background:var(--glass);font-size:.85rem;font-weight:600}
.sw button.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--a),.25)}
.sw i{width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.6);box-shadow:inset 0 2px 3px rgba(255,255,255,.8)}
.acts{display:flex;gap:.6rem;flex-wrap:wrap}
input[type=range]{width:100%;accent-color:var(--accent)}
textarea.inp{resize:vertical;min-height:90px}
#toast{position:fixed;left:50%;bottom:calc(1.4rem + env(safe-area-inset-bottom,0));transform:translate(-50%,30px);opacity:0;z-index:50;padding:.65rem 1.1rem;border-radius:999px;font-size:.86rem;transition:.25s;pointer-events:none}
#toast.show{transform:translate(-50%,0);opacity:1}
@media(max-width:760px){
 aside{position:fixed;z-index:10;left:.35rem;top:.35rem;bottom:.35rem;transform:translateX(-120%);background:color-mix(in srgb,var(--bg) 82%,transparent)}
 aside.open{transform:none}
 #menu{display:grid}
 .modal{flex-direction:column;height:94dvh;border-radius:26px}
 .snav{width:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--stroke);padding:.8rem .8rem .5rem;align-items:center}
 .snav h3{display:none}.snav button{white-space:nowrap}
 .spane{padding:1.1rem}
 .close{position:static;float:right;margin:-.3rem -.4rem 0 0}
}
.chips{max-width:760px;margin:0 auto .5rem;display:flex;gap:.4rem;flex-wrap:wrap}.chip{padding:.3rem .7rem;border-radius:99px;font-size:.78rem;background:var(--glass);border:1px solid var(--stroke);cursor:pointer}
.thumb{display:block;max-width:220px;max-height:200px;border-radius:12px;margin-bottom:.4rem}
#live{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--fg);color:var(--bg)}#live svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.box.has #live{display:none}.box:not(.has) #send{display:none}
#livev{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;padding:2rem 1rem calc(2rem + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4)}#livev.hidden{display:none}
.orb{width:150px;height:150px;border-radius:50%;border:1px solid var(--stroke);cursor:pointer;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.8),rgba(var(--a2),.7) 38%,rgba(var(--a),.55) 70%,rgba(var(--a),.25))}
#livev[data-s=listen] .orb{animation:orbL 2.4s ease-in-out infinite}#livev[data-s=think] .orb{animation:orbT 1s ease-in-out infinite}#livev[data-s=speak] .orb{animation:orbS .9s ease-in-out infinite}
@keyframes orbL{50%{transform:scale(1.07)}}@keyframes orbT{50%{transform:scale(.92);opacity:.6}}@keyframes orbS{25%{transform:scale(1.12)}60%{transform:scale(.97)}}
@media(prefers-reduced-motion:reduce){.orb{animation:none!important}}
.lst{font-weight:700;font-size:1.1rem}.lhint{color:var(--mut);font-size:.82rem;min-height:1.1em;margin-top:-.8rem}
#mic.on{background:rgba(var(--a),.4);color:var(--fg);animation:pl 1.2s infinite}@keyframes pl{50%{box-shadow:0 0 0 8px rgba(var(--a),.15)}}
.dd{position:relative}
.ddbtn{display:flex;align-items:center;gap:.15rem;padding:.35rem .5rem .35rem .7rem;border-radius:99px}.ddbtn:hover{background:var(--glass2)}
.ddbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;color:var(--mut);transition:transform .2s}.ddbtn[aria-expanded=true] svg{transform:rotate(180deg)}
.menu{position:absolute;top:calc(100% + 8px);left:0;min-width:250px;padding:.4rem;border-radius:20px;z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent)}
.menu button{display:block;width:100%;text-align:left;padding:.6rem .8rem;border-radius:14px;font-size:.9rem;font-weight:600}.menu button small{display:block;color:var(--mut);font-size:.74rem;font-weight:400}.menu button:hover,.menu button.on{background:var(--glass2)}
.thumb.big{max-width:min(340px,100%);max-height:none}
.sheet-wrap{place-items:end center;padding:0}
.sheetbox{width:100%;max-width:560px;border-radius:30px 30px 0 0;padding:.6rem 1rem calc(1rem + env(safe-area-inset-bottom,0));max-height:90dvh;overflow:auto;background:color-mix(in srgb,var(--bg) 86%,transparent)}
.sheetbox svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.grab{width:44px;height:5px;border-radius:9px;background:var(--stroke);margin:.2rem auto .6rem}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:.6rem}
.tiles button{display:flex;flex-direction:column;align-items:center;gap:.4rem;padding:.9rem .4rem;border-radius:22px;background:var(--glass);border:1px solid var(--stroke);font-size:.85rem;font-weight:600}
.li{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;padding:.65rem .5rem;border-radius:18px}
button.li:hover,.li.on{background:var(--glass2)}
.li i{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--stroke);flex:none}
.li.on i{background:rgba(var(--a),.45)}
.li div{flex:1;min-width:0}.li b{display:block;font-size:.95rem}.li small{color:var(--mut);font-size:.78rem}
.tg{width:50px;height:30px;border-radius:99px;background:var(--glass2);border:1px solid var(--stroke);position:relative;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--fg);transition:transform .2s}
.tg[aria-checked=true]{background:rgba(var(--a),.75)}.tg[aria-checked=true]::after{transform:translateX(20px)}
.cv-bar{display:flex;gap:.5rem;align-items:center;padding:.7rem;border-bottom:1px solid var(--stroke);flex-wrap:wrap}
.cv-bar .btn{padding:.5rem .9rem}
.or{display:flex;align-items:center;gap:.7rem;color:var(--mut);font-size:.78rem;margin:1rem 0}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--stroke)}
#g-slot{display:flex;justify-content:center;min-height:0}
.sso{display:flex;align-items:center;justify-content:center;gap:.7rem;width:100%;padding:.8rem;margin-bottom:.6rem;border-radius:999px;background:var(--glass);border:1px solid var(--stroke);font-weight:600;font-size:.92rem}
.sso:hover{background:var(--glass2)}.sso svg{width:20px;height:20px}
.li i svg{width:20px;height:20px}#methods .li{padding:.5rem 0}#methods .btn{padding:.45rem .9rem;font-size:.82rem}
.empty h2{background:linear-gradient(110deg,#e0569a,#8a6cf0 55%,#3c8fe8);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:2.1rem;line-height:1.15}
[data-theme=dark] .empty h2{background-image:linear-gradient(110deg,#ff8abe,#b69cff 55%,#6eb9ff);-webkit-background-clip:text;background-clip:text}
.logo.big{width:62px;height:62px;border-radius:21px;margin:0 auto 1.3rem;box-shadow:0 10px 40px rgba(var(--a),.55),inset 0 1px 0 rgba(255,255,255,.7)}.logo.big svg{width:32px;height:32px}
.quick{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin:1.8rem auto 0;max-width:520px}
.quick button{padding:.6rem 1rem;border-radius:99px;background:var(--glass);border:1px solid var(--stroke);font-size:.86rem;font-weight:600;backdrop-filter:blur(14px)}.quick button:hover{background:var(--glass2)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-theme="light" data-accent="pink">
<div class="bg"><i></i><i></i></div>

<!-- AUTH -->
<section id="auth" class="view">
 <div class="card glass">
  <div class="brand"><div class="logo"><svg viewBox="0 0 24 24"><path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z"/></svg></div><b>Atset AI</b></div>
  <div id="a-tabs" class="tabs"><button data-m="in" class="on">Sign in</button><button data-m="up">Create account</button></div>
  <div id="a-head"><h1 id="a-h1"></h1><p class="sub" id="a-sub"></p></div>
  <div id="oauth">
   <div id="g-slot" style="display:flex;justify-content:center;margin-bottom:.6rem"></div>
   <button type="button" class="sso hidden" id="g-setup"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1A11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>Continue with Google</button>
   <div id="oauth-btns"></div>
   <div class="or"><span>or use email</span></div>
  </div>

  <form id="f-in" novalidate>
   
   <label class="field"><span>Email</span><input class="inp" id="in-email" name="email" type="email" autocomplete="username" placeholder="you@gmail.com"></label>
   <label class="field"><span>Password</span><div class="pw"><input class="inp" id="in-pw" name="password" type="password" autocomplete="current-password" placeholder="Your password"><button type="button" data-show="in-pw">Show</button></div></label>
   <div class="row"><label class="chk"><input type="checkbox" id="in-remember" checked> Keep me signed in</label><button type="button" class="link" id="to-forgot">Forgot password?</button></div>
   <div class="msg e" id="in-msg"></div>
   <button class="btn" style="width:100%">Sign in</button>
  </form>

  <form id="f-up" class="hidden" novalidate>
   
   <label class="field"><span>Name</span><input class="inp" id="up-name" autocomplete="name" placeholder="What should Atset call you?"
